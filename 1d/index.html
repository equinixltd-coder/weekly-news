<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Denní česky psaný přehled nejdůležitějších světových, politických, finančních, technologických a vědeckých událostí.">
  <meta name="color-scheme" content="light dark">
  <title>Denní světový přehled</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('daily-report-theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      } catch (_) {}
    })();
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --bg:#fff; --text:#0d0d0d; --muted:#6b6b6b; --line:#e5e5e5;
      --soft:#f7f7f8; --soft-strong:#efefef; --link:#0f6f5c;
      --button:#fff; --button-hover:#f2f2f2; --error-bg:#fff7ed; --error-border:#fdba74;
    }
    html[data-theme="dark"] {
      --bg:#212121; --text:#ececec; --muted:#b4b4b4; --line:#3b3b3b;
      --soft:#2a2a2a; --soft-strong:#333; --link:#78d6c1;
      --button:#2a2a2a; --button-hover:#343434; --error-bg:#382a1e; --error-border:#9a5b28;
    }
    html[data-theme="light"] {
      --bg:#fff; --text:#0d0d0d; --muted:#6b6b6b; --line:#e5e5e5;
      --soft:#f7f7f8; --soft-strong:#efefef; --link:#0f6f5c;
      --button:#fff; --button-hover:#f2f2f2; --error-bg:#fff7ed; --error-border:#fdba74;
    }
    @media (prefers-color-scheme:dark) {
      html:not([data-theme]) {
        --bg:#212121; --text:#ececec; --muted:#b4b4b4; --line:#3b3b3b;
        --soft:#2a2a2a; --soft-strong:#333; --link:#78d6c1;
        --button:#2a2a2a; --button-hover:#343434; --error-bg:#382a1e; --error-border:#9a5b28;
      }
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0; background:var(--bg); color:var(--text);
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      font-size:16px; line-height:1.68; -webkit-font-smoothing:antialiased;
      transition:background-color .18s ease,color .18s ease;
    }
    .page { width:min(100% - 32px,760px); margin:0 auto; padding:32px 0 72px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; border-bottom:1px solid var(--line); padding-bottom:16px; margin-bottom:24px; }
    .topbar-left { min-width:0; }
    .eyebrow { color:var(--muted); font-size:13px; }
    .nav { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
    .nav a { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:5px 9px; text-decoration:none; font-size:13px; }
    .nav a[aria-current="page"] { background:var(--soft-strong); font-weight:650; }
    .theme-toggle { flex:0 0 auto; border:1px solid var(--line); background:var(--button); color:var(--text); border-radius:999px; padding:8px 12px; font:inherit; font-size:13px; line-height:1; cursor:pointer; }
    .theme-toggle:hover { background:var(--button-hover); }
    .theme-toggle:focus-visible { outline:2px solid var(--link); outline-offset:2px; }
    h1,h2,h3,h4,h5,h6 { line-height:1.25; letter-spacing:-.02em; scroll-margin-top:24px; }
    h1 { font-size:clamp(30px,6vw,42px); margin:0 0 22px; }
    h2 { font-size:26px; margin:48px 0 18px; }
    h3 { font-size:21px; margin:34px 0 14px; }
    h4 { font-size:17px; margin:26px 0 10px; }
    p { margin:0 0 16px; }
    strong { font-weight:650; }
    a { color:var(--link); text-underline-offset:2px; overflow-wrap:anywhere; }
    hr { border:0; border-top:1px solid var(--line); margin:40px 0; }
    ul,ol { padding-left:1.5rem; margin:0 0 18px; }
    li { margin:7px 0; }
    blockquote { margin:20px 0; padding:2px 0 2px 18px; border-left:3px solid var(--line); color:var(--muted); }
    table { display:block; width:100%; overflow-x:auto; border-collapse:collapse; margin:20px 0 28px; font-size:14px; line-height:1.45; -webkit-overflow-scrolling:touch; }
    thead { background:var(--soft-strong); }
    th,td { min-width:116px; padding:11px 12px; border:1px solid var(--line); vertical-align:top; text-align:left; }
    th:first-child,td:first-child { min-width:42px; }
    code { background:var(--soft); padding:2px 5px; border-radius:5px; font-size:.92em; }
    pre { overflow-x:auto; background:var(--soft); padding:16px; border-radius:10px; border:1px solid var(--line); }
    pre code { padding:0; background:transparent; }
    .loading { color:var(--muted); }
    .error { border:1px solid var(--error-border); background:var(--error-bg); border-radius:12px; padding:16px 18px; }
    footer { margin-top:56px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }
    @media (max-width:600px) {
      .page { width:min(100% - 24px,760px); padding-top:20px; }
      body { font-size:15.5px; }
      th,td { padding:9px 10px; min-width:108px; }
      .topbar { align-items:flex-start; }
    }
    @media print {
      .page { width:100%; max-width:760px; padding:0; }
      .theme-toggle,.nav { display:none; }
      table { display:table; overflow:visible; }
      a { color:inherit; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <div class="topbar-left">
        <div class="eyebrow" id="updated">Načítání denního reportu…</div>
        <nav class="nav" aria-label="Verze přehledu">
          <a href="../">Týdenní</a>
          <a href="./" aria-current="page">1D</a>
          <a href="report.md">Markdown</a>
        </nav>
      </div>
      <button class="theme-toggle" type="button" aria-label="Přepnout barevný motiv" aria-pressed="false">Tmavý režim</button>
    </div>
    <article id="report" class="loading" aria-live="polite">Načítání úplného reportu z <code>report.md</code>…</article>
    <noscript><p class="error">Pro formátované zobrazení je potřeba JavaScript. Úplný text je dostupný v <a href="report.md">report.md</a>.</p></noscript>
    <footer>Denní zdroj je uložen jako <a href="report.md">1d/report.md</a>. Stránka nepoužívá analytické skripty, cookies ani externí fonty.</footer>
  </main>
  <script>
    (() => {
      const button=document.querySelector('.theme-toggle');
      const media=window.matchMedia('(prefers-color-scheme: dark)');
      const active=()=>document.documentElement.dataset.theme||(media.matches?'dark':'light');
      const render=()=>{const dark=active()==='dark';button.textContent=dark?'Světlý režim':'Tmavý režim';button.setAttribute('aria-pressed',dark?'true':'false');};
      button.addEventListener('click',()=>{const next=active()==='dark'?'light':'dark';document.documentElement.dataset.theme=next;try{localStorage.setItem('daily-report-theme',next);}catch(_){}render();});
      if(media.addEventListener)media.addEventListener('change',()=>{if(!document.documentElement.dataset.theme)render();});
      render();
    })();

    (() => {
      const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
      const inline=source=>{
        let s=esc(source),codes=[];
        s=s.replace(/`([^`]+)`/g,(_,c)=>{const i=codes.length;codes.push(`<code>${c}</code>`);return `@@C${i}@@`;});
        s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|\.\.?\/[^\s)]+)\)/g,'<a href="$2" rel="noopener noreferrer">$1</a>');
        s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
        s=s.replace(/__([^_]+)__/g,'<strong>$1</strong>');
        s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
        s=s.replace(/@@C(\d+)@@/g,(_,i)=>codes[Number(i)]||'');
        return s;
      };
      const cells=line=>{let v=line.trim();if(v.startsWith('|'))v=v.slice(1);if(v.endsWith('|'))v=v.slice(0,-1);return v.split('|').map(x=>x.trim());};
      const md=source=>{
        const lines=source.replace(/\r\n?/g,'\n').split('\n'),out=[];
        let para=[],list=null,inCode=false,lang='',code=[];
        const fp=()=>{if(para.length){out.push(`<p>${inline(para.join(' '))}</p>`);para=[];}};
        const fl=()=>{if(list){out.push(`<${list.type}>${list.items.map(x=>`<li>${inline(x)}</li>`).join('')}</${list.type}>`);list=null;}};
        const close=()=>{fp();fl();};
        for(let i=0;i<lines.length;i++){
          const line=lines[i];
          if(inCode){if(/^```/.test(line)){out.push(`<pre><code${lang?` class="language-${esc(lang)}"`:''}>${esc(code.join('\n'))}</code></pre>`);inCode=false;lang='';code=[];}else code.push(line);continue;}
          const fence=line.match(/^```\s*([\w-]*)/);if(fence){close();inCode=true;lang=fence[1]||'';continue;}
          if(/^<!--.*-->$/.test(line.trim()))continue;
          if(!line.trim()){close();continue;}
          if(/^\s*(?:---+|___+|\*\*\*+)\s*$/.test(line)){close();out.push('<hr>');continue;}
          const h=line.match(/^(#{1,6})\s+(.+)$/);if(h){close();const n=h[1].length;out.push(`<h${n}>${inline(h[2])}</h${n}>`);continue;}
          if(line.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[i+1])){
            close();const heads=cells(line);i+=2;const rows=[];while(i<lines.length&&lines[i].includes('|')&&lines[i].trim()){rows.push(cells(lines[i]));i++;}i--;
            out.push('<table><thead><tr>'+heads.map(x=>`<th>${inline(x)}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+heads.map((_,n)=>`<td>${inline(r[n]||'')}</td>`).join('')+'</tr>').join('')+'</tbody></table>');continue;
          }
          const o=line.match(/^\s*\d+\.\s+(.+)$/),u=line.match(/^\s*[-+*]\s+(.+)$/);if(o||u){fp();const type=o?'ol':'ul';if(!list||list.type!==type){fl();list={type,items:[]};}list.items.push((o||u)[1]);continue;}
          const q=line.match(/^>\s?(.*)$/);if(q){close();out.push(`<blockquote>${inline(q[1])}</blockquote>`);continue;}
          para.push(line.trim());
        }
        close();if(inCode)out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);return out.join('\n');
      };
      fetch('report.md?ts='+Date.now(),{cache:'no-store'})
        .then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.text();})
        .then(source=>{
          document.getElementById('report').className='';
          document.getElementById('report').innerHTML=md(source);
          const stamp=source.match(/(?:updated|generated):\s*([^\s>]+(?:T[^\s>]*)?)/i);
          const cutoff=source.match(/\*\*(?:Uzávěrka informací|Čas uzávěrky|Uzávěrka):\*\*\s*([^\n]+)/i);
          document.getElementById('updated').textContent=cutoff?`Aktualizováno: ${cutoff[1].trim()}`:(stamp?`Aktualizováno: ${stamp[1]}`:'Denní světový přehled');
          document.title=(document.querySelector('h1')?.textContent||'Denní světový přehled');
        })
        .catch(error=>{
          document.getElementById('report').className='error';
          document.getElementById('report').innerHTML=`<strong>Report se nepodařilo načíst.</strong><p>${esc(error.message)}</p><p><a href="report.md">Otevřít report.md přímo</a></p>`;
          document.getElementById('updated').textContent='Chyba načítání reportu';
        });
    })();
  </script>
</body>
</html>
